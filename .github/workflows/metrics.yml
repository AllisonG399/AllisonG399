name: 📊 GitHub Metrics

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

concurrency:
  group: github-main-updates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - uses: lowlighter/metrics@latest

        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: AllisonG399
          template: classic

          base: ""

          config_timezone: America/Chicago

          # ----------------------------------------
          # Isometric Commit Calendar
          # ----------------------------------------

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # ----------------------------------------
          # Languages
          # ----------------------------------------

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          
          # ----------------------------------------
          # Habits
          # ----------------------------------------

          plugin_habits: yes
          plugin_habits_days: 14


  # ========================================
  # Custom GitHub Statistics
  # ========================================

  github-stats:
    needs: github-metrics
    runs-on: ubuntu-latest
  
    steps:
  
      # ----------------------------------------
      # Checkout repository
      # ----------------------------------------
  
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
  
      # ----------------------------------------
      # Generate statistics
      # ----------------------------------------
  
      - name: Generate GitHub statistics
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: node scripts/generate-github-stats.js
  
      # ----------------------------------------
      # Commit updated statistics
      # ----------------------------------------
  
      - name: Commit statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
  
          git add assets/github-stats.svg
  
          if git diff --cached --quiet; then
            echo "No statistics changes to commit."
          else
            git commit -m "chore: update GitHub statistics"
  
            git pull --rebase origin main
  
            git push
          fi
